  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b13"/><stop offset="1" stop-color="#0f1726"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1b2536" stroke-width="1" opacity=".7"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="320" rx="16"/></clipPath>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".22"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="830" y1="158" x2="791.6" y2="79.2">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".5"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff"/>
      <stop offset=".75" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="rainmask"><rect width="900" height="320" fill="url(#fade)"/></mask>
    <clipPath id="type"><rect x="44" y="176" width="480" height="28">
      <set attributeName="width" to="0" begin="0s" dur="1.8s"/>
      <animate attributeName="width" from="0" to="480" begin="1.8s" dur="2.2s" fill="freeze"/>
    </rect></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .rain { animation: rain linear infinite; }
    @keyframes rain { from { transform: translateY(-240px) } to { transform: translateY(330px) } }
    .f1 { opacity: 0; animation: f1 10s steps(1) infinite; }
    .f2 { opacity: 0; animation: f2 10s steps(1) infinite; }
    .nm { animation: nm 10s steps(1) infinite; }
    .gc { opacity: 0; animation: gc 10s steps(1) infinite; }
    .gr { opacity: 0; animation: gr 10s steps(1) infinite; }
    @keyframes f1 { 0% {opacity:1} 7% {opacity:0} 100% {opacity:0} }
    @keyframes f2 { 0% {opacity:0} 7% {opacity:1} 13% {opacity:0} 100% {opacity:0} }
    @keyframes nm { 0% {opacity:0} 13% {opacity:1} 100% {opacity:1} }
    @keyframes gc { 0% {opacity:0} 13% {opacity:.85; transform:translate(-5px,0)} 14.5% {opacity:.85; transform:translate(4px,-1px)} 16% {opacity:0}
                    62% {opacity:.8; transform:translate(-3px,1px)} 63.2% {opacity:0} 100% {opacity:0} }
    @keyframes gr { 0% {opacity:0} 13% {opacity:.85; transform:translate(5px,1px)} 14.5% {opacity:.85; transform:translate(-4px,0)} 16% {opacity:0}
                    62% {opacity:.8; transform:translate(3px,-1px)} 63.2% {opacity:0} 100% {opacity:0} }
    .blink { animation: blink 1s steps(1) infinite; }
    .slow  { animation: blink 2s steps(1) infinite; }
    @keyframes blink { 0% {opacity:1} 50% {opacity:0} 100% {opacity:0} }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
  </style>

